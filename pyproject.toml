[project]
name = "qosst-core"
description = "Core submodule of QOSST, containing modules for configuration, control protocol, authentication, modulation and communication filters."
authors = [
  { name = "Yoann Piétri", email = "Yoann.Pietri@lip6.fr" },
  { name = "Ilektra Karakosta-Amarantidou", email = "ilektra.karakostaamarantidou@studenti.unipd.it" },
  { name = "Matteo Schiavon", email = "Matteo.Schiavon@lip6.fr" },
  { name = "Thomas Liege", email = "Thomas.Liege@lip6.fr" },
]
license = "GPL-3.0-only"
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Security :: Cryptography",
]
requires-python = ">=3.11, <3.15"
version = "0.10.4.dev4"

dependencies = [
  "numpy >=2.2.0, <3.0",
  "scipy >=1.17.0, <2.0",
  "qosst-hal @ git+https://github.com/qosst/qosst-hal@dev",
  "falcon-digital-signature >= 0.9.3, <3.0",
  "toml >= 0.10.2",
  "requests >= 2.27.1",
]

[project.urls]
homepage = "https://github.com/qosst"
repository = "https://github.com/qosst/qosst-core"
documentation = "https://qosst-core.readthedocs.io/"

[project.scripts]
qosst = "qosst_core.commands:main"

[dependency-groups]
dev = [
  "Sphinx>=8.1.0",
  "sphinx-rtd-theme>=3.0.0",
  "docstr-coverage>=2.2.0",
  "myst-parser>=4.0.0",
  "sphinx-prompt>=1.5.0",
  "sphinx-argparse-cli>=1.11.0",
  "sphinxcontrib-programoutput>=0.17",
  "matplotlib>=3.5.1",
  "setuptools>=82.0.1",
  "mypy>=1.3.0",
  "pylint>=4.0.5",
  "black>=26.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qosst_core/"]

[tool.hatch.build.targets.wheel.force-include]
"qosst_core/py.typed" = "qosst_core/py.typed"
"qosst_core/configuration/config.example.toml" = "qosst_core/configuration/config.example.toml"

[tool.hatch.metadata]
allow-direct-references = true