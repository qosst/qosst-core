[tool.poetry]
name = "qosst-core"
version = "0.10.4"
description = "Core submodule of QOSST, containing modules for configuration, control protocol, authentication, modulation and communication filters."
authors = [
  "Yoann Piétri <Yoann.Pietri@lip6.fr>",
  "Ilektra Karakosta-Amarantidou <ilektra.karakostaamarantidou@studenti.unipd.it>",
  "Matteo Schiavon <Matteo.Schiavon@lip6.fr>",
]
include = ["qosst_core/configuration/config.example.toml"]
packages = [{ include = "qosst_core" }, { include = "qosst_core/py.typed" }]
license = "GPLv3"
readme = "README.md"
homepage = "https://github.com/qosst"
repository = "https://github.com/qosst/qosst-core"
documentation = "https://qosst-core.readthedocs.io/"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Security :: Cryptography",
]

[tool.poetry.dependencies]
python = ">=3.9, <3.14"
numpy = [
  { version = "^1.26.0", python = ">=3.9, <3.11" },
  { version = "^2.2.0", python = ">=3.11, <3.14" },
]
scipy = [
  { version = "^1.13.0", python = ">=3.9, <3.10" },
  { version = "^1.15.0", python = ">=3.10, <3.14" },
]
#qosst-hal = "^0.10.0"
qosst-hal = { git = "https://github.com/qosst/qosst-hal", branch = "dev" }
falcon-digital-signature = "^0.9.3"
toml = "^0.10.2"
requests = "^2.27.1"
importlib-metadata = { version = "*", python = "<3.8" }

[tool.poetry.group.dev.dependencies]
Sphinx = [
  { version = "^5.0.0", python = ">=3.9, <3.10" },
  { version = "^8.1.0", python = ">=3.10, <3.14" },
]
sphinx-rtd-theme = [
  { version = "^1.0.0", python = ">=3.9, <3.10" },
  { version = "^3.0.0", python = ">=3.10, <3.14" },
]
docstr-coverage = "^2.2.0"
myst-parser = [
  { version = "^1.0.0", python = ">=3.9, <3.10" },
  { version = "^4.0.0", python = ">=3.10, <3.14" },
]
sphinx-prompt = "^1.5.0"
sphinx-argparse-cli = "^1.11.0"
sphinxcontrib-programoutput = "^0.17"
matplotlib = "^3.5.1"
setuptools = "^67.6.1"
mypy = "^1.3.0"
pylint = "^3.3.0"
black = "^23.9.1"

[tool.poetry.scripts]
qosst = "qosst_core.commands:main"

[build-system]
requires = ["poetry-core>=1.0.0", "setuptools", "wheel"]
build-backend = "poetry.core.masonry.api"
